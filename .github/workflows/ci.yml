
name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_API_URL: http://localhost:3000
      MONGOMS_VERSION: "8.2.6"
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.cache/mongodb-binaries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore MongoDB binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: ${{ runner.os }}-mongodb-${{ env.MONGOMS_VERSION }}

      - name: Install dependencies
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"
        run: npm ci

      - name: Typecheck shared contracts
        run: npm run typecheck -w shared

      - name: Typecheck server
        run: npm run typecheck -w server

      - name: Build and typecheck client
        run: npm run build -w client

      - name: Run integration tests
        run: npm run test -w server

  publish:
    name: Build and publish Docker image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: maximo815
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            maximo815/article-backend:${{ github.sha }}
            maximo815/article-backend:latest

  deploy:
    name: Deploy to IONOS VPS
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy container and verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -se -- '${GITHUB_SHA}'" <<'REMOTE'
          set -euo pipefail

          IMAGE="maximo815/article-backend:$1"

          docker pull "$IMAGE"

          docker rm -f article-backend 2>/dev/null || true

          docker run -d \
            --name article-backend \
            --restart unless-stopped \
            --env-file /root/article-backend.env \
            -p 127.0.0.1:3001:3000 \
            "$IMAGE"

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3001/health; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 3
          done

          docker logs --tail 40 article-backend
          echo "Deployment failed"
          exit 1
          REMOTE